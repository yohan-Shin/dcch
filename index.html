<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 맞춤형 설교 준비 비서</title>
    <style>
        /* 기본 테마 및 타이포그래피 (연한 하늘색 배경, 경건한 명조체) */
        :root {
            --bg-color: #EBF1F6; /* 연한 하늘색 */
            --point-color: #1E2A38; /* 네이비 */
            --text-color: #2C3E50;
            --white: #FFFFFF;
            --border-color: #D3DCE6;
        }

        body {
            font-family: 'Batang', 'Nanum Myeongjo', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* 상단 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--point-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header-left h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            color: var(--point-color);
        }

        .header-left .date-info {
            margin-top: 10px;
            font-size: 15px;
            color: #555;
        }

        .api-btn {
            background-color: var(--point-color);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .api-btn:hover {
            background-color: #2C3E50;
        }

        /* 폼 영역 */
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-item {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--point-color);
        }

        input[type="text"], select, textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            background-color: #F8FAFC;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--point-color);
        }

        /* 탭 UI */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            color: #7F8C8D;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--point-color);
            border-bottom-color: var(--point-color);
        }

        .tab-content {
            display: none;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
        }

        textarea.full-area {
            width: 100%;
            height: 350px;
            box-sizing: border-box;
            resize: vertical;
        }

        /* Gemini 연동 버튼 및 로딩/결과 */
        .action-btn {
            background-color: #34495E;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .action-btn:hover {
            background-color: var(--point-color);
        }

        #loading-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            color: var(--point-color);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(30, 42, 56, 0.2);
            border-radius: 50%;
            border-top-color: var(--point-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-card {
            background-color: var(--white);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            line-height: 1.8;
        }
        
        .result-card strong {
            color: var(--point-color);
            display: block;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .error-box {
            background-color: #FDF2F2;
            color: #C0392B;
            border: 1px solid #E74C3C;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        /* 모달 (API 설정) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--point-color);
            font-size: 20px;
        }

        .modal-content input {
            width: 100%;
            box-sizing: border-box;
            margin: 15px 0;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            background: #BDC3C7;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-save {
            background: var(--point-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <h1>나만의 맞춤형 설교 준비 비서</h1>
            <div class="date-info" id="date-display">날짜 정보를 불러오는 중...</div>
        </div>
        <button class="api-btn" onclick="openApiModal()">⚙ API 설정</button>
    </header>

    <div class="form-group">
        <div class="form-item" style="flex: 2;">
            <label for="bible-text">성경 본문</label>
            <input type="text" id="bible-text" placeholder="예: 요한복음 3:16, 창세기 1:1-5">
        </div>
        <div class="form-item" style="flex: 2;">
            <label for="sermon-title">설교 제목</label>
            <input type="text" id="sermon-title" placeholder="설교 제목을 입력하세요">
        </div>
        <div class="form-item" style="flex: 1;">
            <label for="target-audience">설교 대상</label>
            <select id="target-audience">
                <option>주일장년</option>
                <option>청년부</option>
                <option>수요기도회</option>
                <option>구역예배</option>
                <option>주일학교</option>
            </select>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(1)">새벽설교</button>
        <button class="tab-btn" onclick="switchTab(2)">구역예배</button>
        <button class="tab-btn" onclick="switchTab(3)">설교문 작성</button>
        <button class="tab-btn" onclick="switchTab(4)">소그룹 나눔</button>
    </div>

    <!-- 탭 1: 새벽설교 (주해/묵상 및 AI 질문 생성) -->
    <div id="tab-1" class="tab-content active">
        <button class="action-btn" onclick="generateQuestions()">📖 기초 묵상 질문 생성</button>
        
        <div id="error-message" class="error-box"></div>
        
        <div id="loading-indicator">
            <div class="spinner"></div>
            <span>묵상 질문을 준비하고 있습니다...</span>
        </div>

        <div id="ai-results">
            <!-- AI 결과가 여기에 카드로 출력됩니다 -->
        </div>

        <textarea class="full-area" placeholder="묵상 내용이나 주해를 자유롭게 작성하세요..." style="margin-top: 15px;"></textarea>
    </div>

    <!-- 탭 2: 구역예배 -->
    <div id="tab-2" class="tab-content">
        <textarea class="full-area" placeholder="구역예배를 위한 개요나 핵심 메시지를 작성하세요..."></textarea>
    </div>

    <!-- 탭 3: 설교문 작성 -->
    <div id="tab-3" class="tab-content">
        <textarea class="full-area" placeholder="전체 설교 원고를 작성하는 공간입니다..."></textarea>
    </div>

    <!-- 탭 4: 소그룹 나눔 -->
    <div id="tab-4" class="tab-content">
        <textarea class="full-area" placeholder="소그룹 나눔을 위한 적용 질문이나 기도 제목을 작성하세요..."></textarea>
    </div>
</div>

<!-- API 설정 모달 -->
<div class="modal-overlay" id="api-modal">
    <div class="modal-content">
        <h2>Google Gemini API 설정</h2>
        <p style="font-size: 14px; color: #7f8c8d; margin-bottom: 5px;">발급받은 API 키를 입력해주세요. 키는 현재 브라우저에만 안전하게 보관됩니다.</p>
        <input type="text" id="api-key-input" placeholder="AIzaSy...">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeApiModal()">취소</button>
            <button class="btn-save" onclick="saveApiKey()">저장</button>
        </div>
    </div>
</div>

<script>
    // 날짜 및 절기 자동 표시
    function updateDateAndSeason() {
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth() + 1;
        const date = today.getDate();
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const day = days[today.getDay()];

        // 간략한 절기 추정 (정확한 교회력은 매년 변동되므로 대략적인 월별 기준 적용)
        let season = "일반 주간";
        if (month === 12 && date >= 1 && date <= 24) season = "대림절";
        else if (month === 12 && date >= 25) season = "성탄절";
        else if (month === 1 && date <= 6) season = "주현절";
        else if ((month === 3 && date > 15) || (month === 4 && date <= 15)) season = "사순절 / 부활절 주간";
        else if (month === 5 && date > 15) season = "성령강림절";
        else if (month === 11 && date > 15 && date < 30) season = "추수감사절 주간";

        const dateString = `${year}년 ${month}월 ${date}일 (${day}요일) · 현재 절기: ${season}`;
        document.getElementById('date-display').innerText = dateString;
    }

    // 탭 전환 기능
    function switchTab(tabIndex) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === (tabIndex - 1));
        });
        document.querySelectorAll('.tab-content').forEach((content, idx) => {
            content.classList.toggle('active', idx === (tabIndex - 1));
        });
    }

    // API 모달 제어
    const modal = document.getElementById('api-modal');
    const keyInput = document.getElementById('api-key-input');

    function openApiModal() {
        const savedKey = localStorage.getItem('geminiApiKey');
        if (savedKey) keyInput.value = savedKey;
        modal.style.display = 'flex';
    }

    function closeApiModal() {
        modal.style.display = 'none';
    }

    function saveApiKey() {
        const key = keyInput.value.trim();
        if (key) {
            localStorage.setItem('geminiApiKey', key);
            alert('API 키가 저장되었습니다.');
            closeApiModal();
        } else {
            alert('API 키를 입력해주세요.');
        }
    }

    // Gemini API 연동 (묵상 질문 생성)
   // Gemini API 연동 (묵상 질문 생성)
    async function generateQuestions() {
        const apiKey = localStorage.getItem('geminiApiKey');
        const bibleText = document.getElementById('bible-text').value.trim();
        const target = document.getElementById('target-audience').value;
        const errorBox = document.getElementById('error-message');
        const loading = document.getElementById('loading-indicator');
        const resultsArea = document.getElementById('ai-results');

        // 초기화
        errorBox.style.display = 'none';
        resultsArea.innerHTML = '';

        // 검증
        if (!apiKey) {
            errorBox.innerText = "⚠️ API 설정에서 키를 먼저 입력하세요 (우측 상단 ⚙ 버튼)";
            errorBox.style.display = 'block';
            return;
        }
        if (!bibleText) {
            errorBox.innerText = "⚠️ 성경 본문을 먼저 입력해주세요.";
            errorBox.style.display = 'block';
            return;
        }

        // 로딩 표시
        loading.style.display = 'flex';

// [기본 지시문] 및 프롬프트 구성
        const systemInstruction = `[기본 지시문]
너는 개혁주의 신학을 존중하는 신학 연구 조교다.
완성된 설교 원고는 절대 쓰지 말고, 목회자의 묵상과 연구를 돕는 자료만 제공한다.
성경 장·절을 인용할 때는 확실한 것만 말하고, 불확실하면 “확인이 필요합니다”라고 밝힌다.
한국 교회 강단에서 쓰는 자연스러운 경어체로 쓴다.\n\n`;

        const taskPrompt = `다음 성경 본문을 읽고, '${target}'을 대상으로 설교를 준비하는 목회자가 깊이 고민해볼 만한 핵심 묵상 질문 3가지를 작성해주세요. 
답변은 각 질문별로 '질문'과 '해설(묵상 포인트)'을 포함하여 작성하고, 
출력 형식은 마크다운 기호 없이 질문1:, 해설1:, 질문2:, 해설2:, 질문3:, 해설3: 형태의 순수 텍스트로만 반환해주세요.
본문: ${bibleText}`;

        const fullPrompt = systemInstruction + taskPrompt;

        const requestBody = {
            contents: [{ parts: [{ text: fullPrompt }] }],
            generationConfig: {
                maxOutputTokens: 2048, // 출력 길이 확장 (더 길고 상세한 답변)
                temperature: 0.85,     // 창의성 향상 (다양하고 풍부한 표현)
                topP: 0.8,             // 일관성 제어 (형식적 안정성 유지)
                topK: 40               // 일관성 제어 (핵심 문맥 이탈 방지)
            }
        };

        try {
            // 수정됨: 모델명을 gemini-3.8-flash로 변경
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || 'API 요청 중 알 수 없는 오류가 발생했습니다.');
            }

            const aiText = data.candidates[0].content.parts[0].text;
            
            // 수정됨: filter(Boolean)을 제거하여 원본 배열 구조를 유지하고 더 안전하게 파싱하도록 변경
            const questions = aiText.split(/(질문[1-3]:)/g);
            
            let formattedHtml = '';
            
            if (questions.length > 1) {
                for (let i = 0; i < questions.length; i++) {
                    // "질문1:" 같은 텍스트 패턴을 찾은 경우에만 처리
                    if (/질문[1-3]:/.test(questions[i])) {
                        let qLabel = questions[i];
                        let contentText = questions[i+1] || ""; 
                        
                        let textParts = contentText.split(/(해설[1-3]:)/g);
                        let qText = textParts[0].trim();
                        let aText = textParts.length > 2 ? textParts[2].trim() : textParts.slice(1).join('').trim();
                        
                        formattedHtml += `
                            <div class="result-card">
                                <strong>🤔 ${qLabel.replace(':', '')} ${qText}</strong>
                                <div>💡 ${aText}</div>
                            </div>
                        `;
                        
                        i++; // 질문의 본문 내용 배열 인덱스는 건너뜀
                    }
                }
            } else {
                const paragraphs = aiText.split('\n\n').filter(p => p.trim());
                paragraphs.forEach(p => {
                    formattedHtml += `<div class="result-card">${p.replace(/\n/g, '<br>')}</div>`;
                });
            }

            resultsArea.innerHTML = formattedHtml;

        } catch (error) {
            errorBox.innerHTML = `<strong>⚠️ API 호출 실패:</strong><br>${error.message}<br><small style="margin-top:5px;display:block;color:#7f8c8d;">※ API 키가 유효한지, 혹은 할당량을 초과하지 않았는지 확인해주세요.</small>`;
            errorBox.style.display = 'block';
        } finally {
            loading.style.display = 'none';
        }
    }
    // 초기화 실행
    updateDateAndSeason();
</script>

</body>
</html>
